# 最小 CI：安装开发依赖 + 语法检查 + 单元测试 + 客户端离线渲染冒烟。
#
# 与本地 `cd dsh-mini-superagent && npm run check:dev` 跑的是同一串命令，顺序也一致：
# 先拦住「文件根本解析不了」，再跑断言，最后跑客户端渲染冒烟。
# `npm ci` 只为装 @deepseek-ai/schemastery（Config schema 的开发依赖）；它仍是零运行时
# 依赖：peer/dev 不随 tarball 发布，也不在用户侧安装。
# 不用 `continue-on-error`：首次接入若暴露既有失败，应该修失败，而不是让闸门装成绿的。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # package.json 在 dsh-mini-superagent/ 下，所有命令都在包目录里跑，
        # 与本地 `cd dsh-mini-superagent` 之后的执行环境一致。
        working-directory: dsh-mini-superagent
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 对齐 package.json 的 engines.node（^22.19.0 || >=24）取 22 这条线。
          node-version: '22'
          cache: npm
          cache-dependency-path: dsh-mini-superagent/package-lock.json

      - name: 安装开发依赖
        run: npm ci

      - name: 语法检查
        run: node scripts/check-syntax.mjs

      - name: 单元测试
        run: node --test

      - name: 客户端离线渲染冒烟
        # client-smoke.mjs 在仓库根 scripts/ 下（不在包目录），所以路径要上跳一层。
        run: node ../scripts/client-smoke.mjs
