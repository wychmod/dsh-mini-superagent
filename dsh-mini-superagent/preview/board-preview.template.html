<script>
/* ── 假 ModuleLoader：client/index.js 会把模块塞进 window.__mod ── */
window.__ModuleLoader__ = {
  load: function (pack) {
    window.__mod = pack.factory(function (name) {
      if (name === 'react') return React
      if (name === 'react-dom') return ReactDOM
      throw new Error('unexpected require: ' + name)
    })
  }
}

/* ── 假宿主 ctx：只实现插件用到的那几个面 ── */
var registrations = []
var slots = {
  inject: function (name, fn) {
    var real = slots.register
    slots.register = function (options, component) {
      registrations.push({ slot: name, options: options || {}, component: component })
      return function () {}
    }
    try { fn() } finally { slots.register = real }
    return function () {}
  },
  register: function () { return function () {} }
}
var ctx = {
  slots: slots,
  logger: { info: function () {}, warn: function () {}, error: function () {} },
  get: function () { return undefined },
  effect: function (fn) { if (typeof fn === 'function') fn(); return function () {} },
  inject: function (names, fn) { if (typeof fn === 'function') fn() }
}

window.fetch = function (url, options) {
  var target = String(url)
  if (target.indexOf('/board') >= 0 && (!options || !options.method || options.method === 'GET')) {
    return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(JSON.parse(JSON.stringify(board))) } })
  }
  return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve({ ok: true }) } })
}
</script>

<!--CLIENT_SOURCE-->

<script>
(function boot() {
  var root = document.getElementById('root')
  try {
    if (!window.__mod) throw new Error('client/index.js 没有加载成功（客户端模块需要 window.__ModuleLoader__）')
    window.__mod.apply(ctx)
    var main = registrations.filter(function (item) { return item.slot === 'main' })[0]
    if (!main) throw new Error('没有找到 main 槽的注册')
    root.innerHTML = ''
    ReactDOM.createRoot(root).render(React.createElement(main.component))
  } catch (error) {
    root.innerHTML = '<div class="fail">预览失败：' + (error && error.message ? error.message : String(error)) + '</div>'
  }
})()
</script>
