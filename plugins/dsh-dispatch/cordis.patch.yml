# dsh-dispatch bundle layer.
#
# 只插入一个 Host 插件行。插件本身是纯 ESM，无构建、无运行时依赖。
# config 全部可选；不写也可以工作（见 index.js 顶部的 DEFAULTS）。
- insert:
    - id: dsh-dispatch
      name: dsh-dispatch
      config:
        # 同时运行的子会话上限；超过后 dispatch_launch 会排队（不阻塞主会话）。
        maxWorkers: 6
        # 每个主会话最多派发多少个任务（防止递归派发失控）。
        maxTasksPerSession: 64
        # 子会话默认继承主会话的工作目录；置为 false 时用进程 cwd。
        inheritWorkingDirectory: true
        # 子会话的权限预设。留空表示继承 DSH 默认预设。
        # 后台无人看管的场景可设为 danger-full-access，避免子会话卡在审批上。
        permissionPreset: ''
        # 子会话落盘的状态文件目录；留空表示 <DSH_HOME>/dsh-dispatch。
        stateDir: ''
